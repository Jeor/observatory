services:
  observatory:
    image: ghcr.io/jeor/observatory:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${OBSERVATORY_BIND:-127.0.0.1}:${OBSERVATORY_PORT:-18085}:8080"
    environment:
      CONFIG_DIR: /config
      DATA_DIR: /config/data
      OBSERVATORY_MODE: live
    volumes:
      - observatory-config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
volumes:
  observatory-config:
