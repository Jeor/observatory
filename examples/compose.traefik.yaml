# Standalone alternative: docker compose --env-file .env -f examples/compose.traefik.yaml up -d
# Requires existing Traefik with HTTPS websecure entrypoint and letsencrypt resolver.
services:
  observatory:
    image: ${OBSERVATORY_IMAGE:-ghcr.io/jeor/observatory:latest}
    restart: unless-stopped
    environment:
      OBSERVATORY_MODE: live
      CONFIG_DIR: /config
      DATA_DIR: /config/data
      ALLOWED_HOSTS: ${OBSERVATORY_DOMAIN:?Set your dashboard domain}
    volumes:
      - observatory-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK:-proxy}
      traefik.http.routers.observatory.rule: Host(`${OBSERVATORY_DOMAIN:?Set your dashboard domain}`)
      traefik.http.routers.observatory.entrypoints: websecure
      traefik.http.routers.observatory.tls.certresolver: letsencrypt
      traefik.http.services.observatory.loadbalancer.server.port: "8080"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
volumes:
  observatory-config:
